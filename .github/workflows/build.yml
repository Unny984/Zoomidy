name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - levilamina_version: "26.20"
            suffix: ""
          - levilamina_version: "26.10"
            suffix: "-26.10"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # levibuildscript derives the mod version from git tags.

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          # Only the resolved packages, never .xmake/cache (build scratch dirs) -
          # some package recipes (e.g. libcurl) reuse a fixed, non-hashed build
          # directory, so caching it can leak a stale build across versions/runs.
          path: |
            ~/AppData/Local/.xmake/packages
          key: xmake-${{ hashFiles('xmake.lua') }}-${{ matrix.levilamina_version }}
          restore-keys: |
            xmake-${{ matrix.levilamina_version }}-

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=client --levilamina_version=${{ matrix.levilamina_version }} -y

      - run: xmake -v -y

      - uses: actions/upload-artifact@v7
        with:
          name: zoomidy-${{ github.sha }}-client-windows-x64${{ matrix.suffix }}
          path: |
            bin/

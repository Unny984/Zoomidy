name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - levilamina_version: "26.20"
            suffix: ""
          - levilamina_version: "26.10"
            suffix: "-26.10"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # levibuildscript reads the mod version from the git tag.

      - uses: xmake-io/github-action-setup-xmake@v1

      # Forces every package (zlib, libssh2, ...) to build from source instead
      # of mixing in precompiled artifacts pinned to a different sub-dependency
      # version - that mix is what produces a stale/mismatched link reference.
      - run: xmake global --policies=package.precompiled:n

      - run: xmake repo -u
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}-${{ matrix.levilamina_version }}

      - id: package-repositories
        shell: pwsh
        run: |
          $revisions = Get-ChildItem "$env:LOCALAPPDATA/.xmake/repositories" -Directory |
            Sort-Object Name |
            ForEach-Object {
              $revision = git -C $_.FullName rev-parse HEAD
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to resolve $($_.Name) repository revision"
              }
              "$($_.Name)-$revision"
            }
          if (-not $revisions) {
            throw "No xmake package repositories were found"
          }
          "revisions=$($revisions -join '-')" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          # Only the resolved packages, never .xmake/cache (build scratch dirs) -
          # those live under XMAKE_PKG_CACHEDIR instead, outside this path.
          path: ~/AppData/Local/.xmake/packages
          key: xmake-packages-source-${{ runner.os }}-${{ matrix.levilamina_version }}-${{ steps.package-repositories.outputs.revisions }}-${{ hashFiles('xmake.lua') }}

      - run: xmake f -a x64 -m release -p windows --target_type=client --levilamina_version=${{ matrix.levilamina_version }} -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}-${{ matrix.levilamina_version }}

      # LeviLamina 26.10.14 pins rapidjson v1.1.0, which predates upstream commit
      # 3b2441b8 (2016) removing a GenericStringRef::operator= that assigns to a
      # const member - invalid C++ that newer clang rejects. 26.20.x already
      # moved to a fixed snapshot; this reproduces that fix for the 26.10 build.
      - if: matrix.levilamina_version == '26.10'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "$env:LOCALAPPDATA/.xmake/packages/r/rapidjson/v1.1.0" -Recurse -Filter "document.h" -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "rapidjson v1.1.0 document.h was not found to patch"
          }
          foreach ($f in $files) {
            $content = Get-Content $f.FullName -Raw
            $patched = $content -replace 'GenericStringRef& operator=\(const GenericStringRef& rhs\) \{ s = rhs\.s; length = rhs\.length; \}\r?\n', ''
            if ($patched -eq $content) {
              throw "rapidjson patch target was not found in $($f.FullName) - upstream file may have changed"
            }
            Set-Content -Path $f.FullName -Value $patched -NoNewline
          }

      - run: xmake -w -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}-${{ matrix.levilamina_version }}

      - uses: actions/upload-artifact@v7
        with:
          name: zoomidy-${{ github.sha }}-client-windows-x64${{ matrix.suffix }}
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - levilamina_version: "26.20"
            suffix: ""
          - levilamina_version: "26.10"
            suffix: "-26.10"
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: zoomidy-${{ github.sha }}-client-windows-x64${{ matrix.suffix }}
          path: artifact

      - run: cp CHANGELOG.md LICENSE README.md artifact/

      # The asset name has to match the urls entry in tooth.json exactly, or lip
      # cannot fetch the release.
      - run: zip -r ../zoomidy-client-windows-x64${{ matrix.suffix }}.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            zoomidy-client-windows-x64${{ matrix.suffix }}.zip

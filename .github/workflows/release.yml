name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - levilamina_version: "26.20"
            suffix: ""
          - levilamina_version: "26.10"
            suffix: "-26.10"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # levibuildscript reads the mod version from the git tag.

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}-${{ matrix.levilamina_version }}
          restore-keys: |
            xmake-${{ matrix.levilamina_version }}-

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows --target_type=client --levilamina_version=${{ matrix.levilamina_version }} -y

      - run: xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: zoomidy-${{ github.sha }}-client-windows-x64${{ matrix.suffix }}
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - levilamina_version: "26.20"
            suffix: ""
          - levilamina_version: "26.10"
            suffix: "-26.10"
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: zoomidy-${{ github.sha }}-client-windows-x64${{ matrix.suffix }}
          path: artifact

      - run: cp CHANGELOG.md LICENSE README.md artifact/

      # The asset name has to match the urls entry in tooth.json exactly, or lip
      # cannot fetch the release.
      - run: zip -r ../zoomidy-client-windows-x64${{ matrix.suffix }}.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            zoomidy-client-windows-x64${{ matrix.suffix }}.zip
